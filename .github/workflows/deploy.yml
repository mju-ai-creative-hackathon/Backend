name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: mju-hackathon-backend

# 빌드한 jar를 artifact로 주고받지 않도록 빌드·배포를 한 job에서 처리한다.
# PR에서는 빌드·테스트만, main push에서는 이어서 이미지 push와 배포까지 한다.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy-prod' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Build & test
        run: ./gradlew build --no-daemon
      - uses: aws-actions/configure-aws-credentials@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & push image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}
          docker build -t $IMAGE -t ${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:latest .
          docker push --all-tags ${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY
          echo "uri=$IMAGE" >> $GITHUB_OUTPUT
      - name: Deploy to EC2 via SSM
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          COMPOSE=$(base64 -w0 deploy/docker-compose.prod.yml)
          CADDY=$(base64 -w0 deploy/Caddyfile)
          SCRIPT=$(base64 -w0 deploy/deploy.sh)
          CMD_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --parameters "commands=[\"set -e\",\"cd /opt/app\",\"echo $COMPOSE | base64 -d > docker-compose.prod.yml\",\"echo $CADDY | base64 -d > Caddyfile\",\"echo $SCRIPT | base64 -d > deploy.sh\",\"bash deploy.sh ${{ steps.image.outputs.uri }}\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id $CMD_ID --instance-id ${{ secrets.EC2_INSTANCE_ID }} --query Status --output text 2>/dev/null || echo Pending)
            case $STATUS in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          RESULT=$(aws ssm get-command-invocation --command-id $CMD_ID --instance-id ${{ secrets.EC2_INSTANCE_ID }})
          echo "$RESULT" | jq -r .StandardOutputContent
          echo "$RESULT" | jq -r .StandardErrorContent
          test "$(echo "$RESULT" | jq -r .Status)" = "Success"
