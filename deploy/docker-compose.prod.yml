# EC2(/opt/app)에서 실행되는 운영 구성. 값은 같은 폴더의 .env 에서 읽는다.
services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: https://${DOMAIN}/login/oauth2/code/google
      FRONTEND_OAUTH_SUCCESS_URL: ${FRONTEND_OAUTH_SUCCESS_URL}
      FRONTEND_OAUTH_FAILURE_URL: ${FRONTEND_OAUTH_FAILURE_URL}
      SPRING_JPA_SHOW_SQL: "false"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SHORTFORM_STORAGE_ROOT: /app/data/shortforms
      SHORTFORM_AI_ENABLED: ${SHORTFORM_AI_ENABLED:-false}
      SHORTFORM_AI_BASE_URL: ${SHORTFORM_AI_BASE_URL:-}
      SHORTFORM_AI_API_KEY: ${SHORTFORM_AI_API_KEY:-}
    volumes:
      - shortform_media:/app/data

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  postgres_data:
  caddy_data:
  shortform_media:
