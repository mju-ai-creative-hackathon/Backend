spring.application.name=backend

server.port=${SERVER_PORT:8080}

# Local PostgreSQL defaults (Docker Compose uses port 5433).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/hackathon}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Use a long random secret in production.
app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-before-production-2026}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.refresh-token.expiration-seconds=${REFRESH_TOKEN_EXPIRATION_SECONDS:604800}

# Web application type OAuth client ID used as the iOS backend/server client ID.
app.google.server-client-id=${GOOGLE_SERVER_CLIENT_ID:191486826471-hj88egpu3at3trb0uo5m08q7md915t5a.apps.googleusercontent.com}

# Seed Seoul sample places only when the place table is empty.
app.seed.places.enabled=${SEED_PLACES_ENABLED:true}

# Private uploads; never expose this directory through a static resource handler.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.file-size-threshold=0
app.shortform.storage-root=${SHORTFORM_STORAGE_ROOT:./data/shortforms}
app.shortform.ai-enabled=${SHORTFORM_AI_ENABLED:false}
app.shortform.ai-base-url=${SHORTFORM_AI_BASE_URL:}
app.shortform.ai-api-key=${SHORTFORM_AI_API_KEY:}
app.shortform.request-timeout-seconds=60
app.shortform.worker-enabled=${SHORTFORM_WORKER_ENABLED:true}
app.shortform.render-timeout-seconds=1800
