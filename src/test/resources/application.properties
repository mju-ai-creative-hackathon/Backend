# Integration tests use isolated PostgreSQL Testcontainers. Docker is required.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-that-is-at-least-thirty-two-bytes-long
app.jwt.expiration-seconds=3600
app.refresh-token.expiration-seconds=604800
app.google.server-client-id=test-google-server-client-id
app.seed.places.enabled=false
app.shortform.worker-enabled=false
app.shortform.storage-root=./build/test-media
